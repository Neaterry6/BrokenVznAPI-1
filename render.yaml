services:
  - type: web
    name: brokenvzn-api
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: brokenvzn-db
          property: connectionString
    autoDeploy: false

databases:
  - name: brokenvzn-db
    databaseName: brokenvzn
    user: admin
    plan: free